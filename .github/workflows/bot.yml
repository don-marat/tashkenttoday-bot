name: TashkentToday Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run python bot_github.py
        env:
          SOURCE_CHANNEL: ${{ secrets.SOURCE_CHANNEL || '@tashkenttodayuz' }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          POSTED_FILE: posted_ids.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: don-marat/tashkenttoday-bot
          WORK_START_HOUR: '9'
          WORK_END_HOUR: '21'
          THREADS_ENABLED: 'true'
        run: python bot_github.py
